name: new-api-custom:hide-model-main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verification:
    permissions:
      contents: read
    uses: ./.github/workflows/feature-recovery-validation.yml

  build:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/danmunaizi/newapi-custom:hide-model-test
            ghcr.io/danmunaizi/newapi-custom:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com/
            GO_PROXY=https://goproxy.cn,https://proxy.golang.org,direct
